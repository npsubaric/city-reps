# Records the README's demo GIF from the live site and commits it.
# Run it by hand (Actions > Record demo GIF > Run workflow) after a visible
# change to the app.

name: Record demo GIF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright and Pillow
        run: |
          pip install playwright pillow
          playwright install --with-deps chromium

      - name: Record the live site
        run: |
          mkdir -p assets
          python scripts/record_demo.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" assets/demo.gif

      - name: Commit the GIF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/demo.gif
          if git diff --cached --quiet; then
            echo "demo.gif unchanged"
          else
            git commit -m "Update demo GIF"
            git push
          fi
