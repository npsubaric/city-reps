name: 'city_reps_dbt'
version: '1.0.0'

profile: 'city_reps_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  city_reps_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    api:
      +materialized: table

seeds:
  city_reps_dbt:
    # Seeds are small, so rebuild them from scratch every run. That way adding
    # a column to a CSV never needs a manual --full-refresh.
    +full_refresh: true
