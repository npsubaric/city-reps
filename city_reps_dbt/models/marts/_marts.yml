version: 2

models:
  - name: dim_new_places
    description: >
      Cafés and bakeries near the spots that passed their city license
      inspection in the last 90 days, minus places already in the app.
      Feeds the app's "New near you" list.
    columns:
      - name: license_no
        tests:
          - unique
          - not_null
      - name: name
        tests:
          - not_null
      - name: kind
        tests:
          - accepted_values:
              arguments:
                values: ['cafe', 'bakery']
      - name: license_passed_on
        description: Date of the latest passed LICENSE or LICENSE RE-INSPECTION.
        tests:
          - not_null
      - name: lat
        tests:
          - not_null

  - name: dim_facilities
    description: One row per licensed location, with its latest inspection.
    columns:
      - name: license_no
        tests:
          - unique
          - not_null
      - name: last_violation_count
        description: Violations noted on the latest inspection (the city separates them with " | ").
        tests:
          - not_null
      - name: last_violations
        description: >
          The inspector's notes from the latest inspection, as the city publishes
          them: one entry per violation ("<number>. <rule> - Comments: <notes>"),
          separated by " | ". Null when nothing was noted.
      - name: inspection_count
        description: Inspections on record for this license since 2024.
        tests:
          - not_null
      - name: failed_inspection_count
        description: How many of those inspections failed.
  - name: dim_spots
    description: >
      One row per City Reps spot, with the best available coordinates and the
      city's license status, latest inspection and hours. models/api/public_spots
      publishes the app's columns from it.
    columns:
      - name: spot_id
        tests:
          - unique
          - not_null
      - name: lat
        tests:
          - not_null
      - name: lon
        tests:
          - not_null
      - name: coord_source
        tests:
          - accepted_values:
              arguments:
                values: ['city_license', 'census', 'openstreetmap']
      - name: license_no
        tests:
          - unique
      - name: license_state
        description: >
          current: license unexpired. on_file: matched but the latest record has
          expired (records lag, so not proof of closing). cancelled: city marked
          it AAC or REV. not_found: a café, bakery or bookstore with no match.
          not_applicable: libraries, parks and other unlicensed spots.
        tests:
          - accepted_values:
              arguments:
                values: ['current', 'on_file', 'cancelled', 'not_found', 'not_applicable']
      - name: last_inspection_date
        description: Date of the latest food inspection for the matched license (inspections since 2024).
      - name: last_inspection_result
        description: Result of that inspection, e.g. PASS, PASS W/ CONDITIONS, FAIL, OUT OF BUSINESS.
      - name: inspector_marked_closed
        description: True when the latest inspection result is OUT OF BUSINESS.
        tests:
          - not_null
      - name: hours_week
        description: >
          7 days, Sunday first. Each day is [open, close] in decimal hours (a
          close past 24 runs past midnight) or null for closed. Null overall
          when no source has readable hours.
      - name: hours_source
        tests:
          - accepted_values:
              arguments:
                values: ['openstreetmap', 'park_district', 'city_of_chicago', 'public_street']
