city_reps_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('SUPABASE_HOST') }}"
      user: "{{ env_var('SUPABASE_USER') }}"
      password: "{{ env_var('SUPABASE_PASSWORD') }}"
      port: 5432
      dbname: postgres
      # analytics by default; CI sets DBT_SCHEMA=ci so PR checks never touch real tables
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
